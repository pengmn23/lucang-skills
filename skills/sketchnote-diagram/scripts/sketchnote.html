<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>手绘笔记风配图工具</title>
<!--
  手绘笔记风配图工具（新版教程配图，风格见 02_写作资料/配图风格规定.md）
  用法：
  1. 用 Chrome 打开这个文件：从模板新建或打开 specs/ 里的 JSON，在图上直接拖动、点选修改，⌘S 存回原文件。
  2. 命令行出图（Agent 用）：python3 render.py specs/xxx.json
  3. 网址带 #spec=<base64url 编码的 JSON>：只渲染图片（render.py 这样调用）；带 #edit&spec=...：打开编辑器并载入这份 JSON。
  说明见同目录 README.md。
-->
<style>
  :root { --ui: -apple-system, "PingFang SC", sans-serif; --line: #D9D2C3; --bg: #EFEAE0; --panel: #FBF9F4; --ink: #2B2B2B; --accent: #2F80ED; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: var(--ui); font-size: 13px; }
  button, select { font: inherit; padding: 5px 9px; border: 1px solid #BDB5A4; background: #fff; border-radius: 6px; cursor: pointer; color: var(--ink); }
  button:hover, select:hover { border-color: #8A8272; }
  button.primary { background: var(--ink); color: #fff; border-color: var(--ink); }
  button.on { background: #FFE47A; border-color: #C9A400; }
  #bar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 8px 12px; background: var(--panel); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5; }
  #bar .brand { font-weight: 700; margin-right: 6px; }
  #bar .sep { width: 1px; height: 22px; background: var(--line); margin: 0 4px; }
  #main { display: grid; grid-template-columns: 340px 1fr 320px; height: calc(100vh - 47px); }
  #main.fold { grid-template-columns: 1fr 320px; }
  #main.fold #left { display: none; }
  @media (max-width: 1250px) { #main:not(.fold) { grid-template-columns: 300px 1fr; } #main:not(.fold) #right { grid-column: 1 / -1; border-left: 0; border-top: 1px solid var(--line); } #main { height: auto; } }
  @media (max-width: 860px) { #main, #main.fold { grid-template-columns: 1fr; height: auto; } #right { border-left: 0; border-top: 1px solid var(--line); } #left { max-height: 60vh; } }
  #left, #right { background: var(--panel); overflow: auto; padding: 10px; }
  #left { border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 6px; }
  #right { border-left: 1px solid var(--line); display: flex; flex-direction: column; gap: 12px; }
  .ph { display: flex; align-items: center; gap: 6px; font-weight: 700; }
  .ph .grow { flex: 1; }
  textarea { width: 100%; font: 12px/1.45 Menlo, monospace; padding: 8px; border: 1px solid var(--line); border-radius: 6px; background: #fff; resize: vertical; }
  #src { flex: 1; min-height: 300px; }
  #selJson { height: 210px; }
  .err { color: #C0392B; font-size: 12px; white-space: pre-wrap; }
  .hint { color: #7A7262; font-size: 12px; line-height: 1.5; }
  #center { overflow: auto; padding: 18px; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  #stage svg { width: 100%; max-width: 1200px; height: auto; box-shadow: 0 2px 14px rgba(0,0,0,.18); display: block; background: #FAF6EC; user-select: none; }
  #stage { width: 100%; display: flex; justify-content: center; }
  #stage [data-path] { cursor: move; }
  #stage [data-path^="edges"] { cursor: pointer; }
  #status { color: #7A7262; font-size: 12px; text-align: center; }
  h3 { margin: 0 0 6px; font-size: 13px; }
  #warnList { margin: 0; padding-left: 18px; }
  #warnList li { margin: 3px 0; cursor: pointer; }
  #warnList li:hover { color: var(--accent); }
  .ok { color: #3C8D4E; }
  .gallery { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .gallery div { border: 1px solid var(--line); border-radius: 6px; background: #fff; text-align: center; padding: 4px 2px; cursor: pointer; font-size: 11px; }
  .gallery div:hover { border-color: var(--accent); }
  .keys { margin: 0; padding-left: 16px; line-height: 1.7; }
  #toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 8px 14px; border-radius: 8px; opacity: 0; transition: opacity .2s; pointer-events: none; }
  #toast.show { opacity: .92; }
  body.render { background: #FAF6EC; }
  body.render #bar, body.render #left, body.render #right, body.render #status { display: none; }
  body.render #main { display: block; height: auto; }
  body.render #center { padding: 0; display: block; }
  body.render #stage svg { width: auto; max-width: none; box-shadow: none; }
</style>
</head>
<body>
<header id="bar">
  <span class="brand">手绘笔记风配图</span>
  <select id="tpl" title="从模板新建一张图"><option value="">＋ 新建…</option></select>
  <button id="bOpen" title="打开 specs 里的 JSON（也可以把文件拖进来）">打开</button>
  <button id="bSave" title="⌘S：存回原文件">保存</button>
  <button id="bSaveAs">另存为</button>
  <span class="sep"></span>
  <button id="bUndo" title="⌘Z">撤销</button>
  <button id="bRedo" title="⇧⌘Z">重做</button>
  <span class="sep"></span>
  <button data-add="input" title="加一个蓝色圆形节点">＋输入</button>
  <button data-add="produce" title="加一个橙色方块节点">＋生产</button>
  <button data-add="feedback" title="加一个绿色六边形节点">＋反馈</button>
  <button id="bEdge" title="先点起点节点，再点终点节点">＋连线</button>
  <button data-add="note">＋批注</button>
  <button data-add="sticky">＋便利贴</button>
  <button data-add="list">＋清单</button>
  <button id="bDup" title="⌘D">复制</button>
  <button id="bDel" title="Delete">删除</button>
  <span class="sep"></span>
  <select id="ratio" title="画布比例"><option value="1600x900">16:9 横版</option><option value="1200x1600">3:4 竖版</option></select>
  <button id="bPng" class="primary" title="2 倍大小，存到「下载」文件夹">导出 PNG</button>
  <button id="bSvg">导出 SVG</button>
  <button id="bJson" title="显示或收起整份 JSON">显示 JSON</button>
</header>
<div id="main" class="fold">
  <aside id="left">
    <div class="ph">整份 JSON <span class="grow"></span><button id="bCopy" title="复制给 Agent 或存档">复制</button></div>
    <textarea id="src" spellcheck="false"></textarea>
    <div id="jsonErr" class="err"></div>
  </aside>
  <section id="center">
    <div id="stage"></div>
    <div id="status"></div>
    <div id="err" class="err"></div>
  </section>
  <aside id="right">
    <div>
      <h3>选中的元素</h3>
      <div id="selName" class="hint">点图上的元素选中它；拖动可以移动（自动对齐到 5 像素，按住 Shift 自由移动）。</div>
      <textarea id="selJson" spellcheck="false" placeholder="选中元素后，这里只显示它的字段，改完自动生效"></textarea>
      <div id="selErr" class="err"></div>
    </div>
    <div>
      <h3>排版提醒 <span id="warnCount"></span></h3>
      <ul id="warnList"></ul>
    </div>
    <div>
      <h3>图标 <span class="hint">（点一下：换掉选中节点的图标）</span></h3>
      <div id="icons" class="gallery"></div>
    </div>
    <div>
      <h3>小涂鸦 <span class="hint">（点一下：加到画面中间）</span></h3>
      <div id="doodles" class="gallery"></div>
    </div>
    <div>
      <h3>快捷键</h3>
      <ul class="keys hint">
        <li>⌘S 保存，⌘Z 撤销，⇧⌘Z 重做</li>
        <li>方向键 移动 1 像素，Shift + 方向键 移动 10 像素</li>
        <li>Delete 删除，⌘D 复制，Esc 取消选中</li>
        <li>双击节点、批注：直接改文字</li>
      </ul>
    </div>
  </aside>
</div>
<div id="toast"></div>
<script src="templates.js"></script>
<script>
"use strict";

/* ---------- 风格常量（和配图风格规定一致） ---------- */
const C = {
  paper: "#FAF6EC", ink: "#2B2B2B", gray: "#4A4A4A",
  blue: "#5BA3E6", blueL: "#DDEBFA", orange: "#F5A04A", orangeL: "#FDE7CF",
  green: "#6CC27A", greenL: "#DDF2DA", yellow: "#FFE47A", pink: "#F8C8D3", mint: "#CDEFC4",
  red: "#E5533D", wood: "#C98E55", woodL: "#EBC897", white: "#FFFFFF"
};
const TYPE = {
  input:    { fill: C.blue,   light: C.blueL,   shape: "circle", word: "输入" },
  produce:  { fill: C.orange, light: C.orangeL, shape: "square", word: "生产" },
  feedback: { fill: C.green,  light: C.greenL,  shape: "hex",    word: "反馈" }
};
const HL = { yellow: C.yellow, pink: C.pink, mint: C.mint, blue: C.blueL, orange: C.orangeL, green: C.greenL, none: null };
const NUM_COLORS = [C.blue, C.orange, C.green, C.red];
const FONT = {
  title: '"Hannotate SC","HanziPen SC","LXGW WenKai","PingFang SC",sans-serif',
  label: '"Hannotate SC","HanziPen SC","PingFang SC",sans-serif',
  hand:  '"HanziPen SC","Hannotate SC","LXGW WenKai","PingFang SC",sans-serif',
  en:    '"Noteworthy","Chalkboard SE","Marker Felt",sans-serif',
  enBold:'"Marker Felt","Chalkboard SE",sans-serif'
};

/* ---------- 随机数（固定种子，保证同一份 JSON 每次画得一样） ---------- */
let rnd = Math.random;
let BOXES = [];  /* 需要检查重叠的元素：[名字, g 元素, 所属节点, 在 JSON 里的位置] */
function reg(name, g, owner, path) { BOXES.push([name, g, owner || name, path || null]); return g; }
let SEED = 7;
function hashStr(s) { let h = 2166136261; for (const ch of s) { h ^= ch.codePointAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
/* 每个元素用自己的随机种子：拖动一个元素时，别的元素的手抖样子不变 */
function seedFor(key) { rnd = seedRng(hashStr(SEED + ":" + key)); }
/* 给元素打上「在 JSON 里的位置」，编辑器靠它实现点选和拖动 */
function tag(g, path) { if (path) g.setAttribute("data-path", path); return g; }
function seedRng(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const J = a => (rnd() * 2 - 1) * a;

/* ---------- SVG 基础 ---------- */
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, parent) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) if (attrs[k] !== undefined && attrs[k] !== null) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
const f1 = v => (Math.round(v * 10) / 10).toString();
function smooth(pts, closed) {
  const n = pts.length; if (n < 2) return "";
  const g = i => closed ? pts[(i + n) % n] : pts[Math.max(0, Math.min(n - 1, i))];
  let d = `M${f1(pts[0][0])},${f1(pts[0][1])}`;
  const last = closed ? n : n - 1;
  for (let i = 0; i < last; i++) {
    const p0 = g(i - 1), p1 = g(i), p2 = g(i + 1), p3 = g(i + 2);
    const c1 = [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6];
    const c2 = [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6];
    d += `C${f1(c1[0])},${f1(c1[1])} ${f1(c2[0])},${f1(c2[1])} ${f1(p2[0])},${f1(p2[1])}`;
  }
  return closed ? d + "Z" : d;
}
function jit(pts, a) { return pts.map(p => [p[0] + J(a), p[1] + J(a)]); }

/* ---------- 文字 ---------- */
const mctx = document.createElement("canvas").getContext("2d");
function tw(s, size, family, weight) { mctx.font = `${weight || 400} ${size}px ${family}`; return mctx.measureText(s).width; }
function lines(s) { return String(s == null ? "" : s).split("\n"); }
/* 在 (x, cy) 处画多行文字，cy 是整段文字的垂直中心 */
function text(parent, x, cy, s, o) {
  o = o || {};
  const size = o.size || 28, lh = o.lh || size * 1.32, ls = lines(s);
  const family = o.font || FONT.hand, weight = o.weight || 400;
  const g = el("g", { transform: o.rotate ? `rotate(${o.rotate} ${f1(x)} ${f1(cy)})` : null }, parent);
  const top = cy - (ls.length - 1) * lh / 2;
  ls.forEach((ln, i) => {
    const t = el("text", {
      x: f1(x), y: f1(top + i * lh), "font-family": family, "font-size": size, "font-weight": weight,
      fill: o.fill || C.ink, "text-anchor": o.anchor || "start", "dominant-baseline": "central",
      "letter-spacing": o.spacing || null,
      stroke: o.stroke || null, "stroke-width": o.sw || null, "paint-order": o.stroke ? "stroke" : null, "stroke-linejoin": "round"
    }, g);
    t.textContent = ln;
  });
  return g;
}
function blockW(s, size, family, weight) { return Math.max(...lines(s).map(l => tw(l, size, family, weight))); }

/* ---------- 手绘形状 ---------- */
function circlePts(cx, cy, r, amp, over) {
  const N = 30, st = rnd() * Math.PI * 2, out = [];
  const total = N + (over ? 3 : 0);
  for (let i = 0; i < total; i++) { const a = st + i / N * Math.PI * 2; const rr = r + J(amp); out.push([cx + Math.cos(a) * rr, cy + Math.sin(a) * rr]); }
  return out;
}
function rrectPts(x, y, w, h, rad, amp) {
  rad = Math.min(rad, w / 2, h / 2);
  const pts = [], step = 55;
  const edge = (x1, y1, x2, y2) => { const L = Math.hypot(x2 - x1, y2 - y1), n = Math.max(1, Math.round(L / step)); for (let i = 0; i < n; i++) pts.push([x1 + (x2 - x1) * i / n + J(amp), y1 + (y2 - y1) * i / n + J(amp)]); };
  const corner = (cx, cy, a0) => { for (let i = 0; i <= 3; i++) { const a = a0 + i / 3 * Math.PI / 2; pts.push([cx + Math.cos(a) * rad + J(amp * .6), cy + Math.sin(a) * rad + J(amp * .6)]); } };
  edge(x + rad, y, x + w - rad, y); corner(x + w - rad, y + rad, -Math.PI / 2);
  edge(x + w, y + rad, x + w, y + h - rad); corner(x + w - rad, y + h - rad, 0);
  edge(x + w - rad, y + h, x + rad, y + h); corner(x + rad, y + h - rad, Math.PI / 2);
  edge(x, y + h - rad, x, y + rad); corner(x + rad, y + rad, Math.PI);
  return pts;
}
function hexPts(cx, cy, rx, ry, amp) {
  const v = []; for (let k = 0; k < 6; k++) { const a = k * Math.PI / 3; v.push([cx + Math.cos(a) * rx, cy + Math.sin(a) * ry]); }
  const pts = [];
  for (let k = 0; k < 6; k++) {
    const a = v[k], b = v[(k + 1) % 6];
    const p = t => [a[0] + (b[0] - a[0]) * t + J(amp), a[1] + (b[1] - a[1]) * t + J(amp)];
    pts.push(p(0.12), p(0.5), p(0.88));
  }
  return pts;
}
/* 先填色（略微错位，像手涂），再画一圈手抖的黑线 */
function sketchShape(parent, kind, geo, o) {
  o = o || {};
  const g = el("g", {}, parent);
  const make = (amp, over) => kind === "circle" ? circlePts(geo.cx, geo.cy, geo.r, amp, over)
    : kind === "hex" ? hexPts(geo.cx, geo.cy, geo.rx, geo.ry, amp)
    : rrectPts(geo.x, geo.y, geo.w, geo.h, geo.rad == null ? 22 : geo.rad, amp);
  if (o.fill) {
    const dx = J(3), dy = J(3);
    const fp = make(o.fillAmp == null ? 1.5 : o.fillAmp, false).map(p => [p[0] + dx, p[1] + dy]);
    el("path", { d: smooth(fp, true), fill: o.fill, opacity: o.fillOpacity == null ? 1 : o.fillOpacity }, g);
  }
  if (o.stroke !== false) {
    let op = make(o.amp == null ? 1.6 : o.amp, kind === "circle");
    let d;
    if (kind === "circle") d = smooth(op, false);
    else { op = op.concat([[op[0][0] + J(3), op[0][1] + J(3)], [op[1][0] + J(4), op[1][1] + J(4)]]); d = smooth(op, false); }
    el("path", { d, fill: "none", stroke: o.color || C.ink, "stroke-width": o.width || 5, "stroke-linecap": "round", "stroke-linejoin": "round", "stroke-dasharray": o.dash || null }, g);
  }
  return g;
}
function wobblyLine(parent, pts, o) {
  o = o || {};
  const d = smooth(jit(pts, o.amp == null ? 1.2 : o.amp), false);
  return el("path", { d, fill: "none", stroke: o.color || C.ink, "stroke-width": o.width || 4, "stroke-linecap": "round", "stroke-linejoin": "round", "stroke-dasharray": o.dash || null, opacity: o.opacity || null }, parent);
}
function qbez(p0, c, p1, t) { const u = 1 - t; return [u * u * p0[0] + 2 * u * t * c[0] + t * t * p1[0], u * u * p0[1] + 2 * u * t * c[1] + t * t * p1[1]]; }
function arrowHead(parent, tip, ang, size, color) {
  const L = size, W = size * 0.5;
  const b = [tip[0] - Math.cos(ang) * L, tip[1] - Math.sin(ang) * L];
  const p1 = [b[0] - Math.sin(ang) * W, b[1] + Math.cos(ang) * W], p2 = [b[0] + Math.sin(ang) * W, b[1] - Math.cos(ang) * W];
  el("path", { d: `M${f1(tip[0])},${f1(tip[1])}L${f1(p1[0] + J(1))},${f1(p1[1] + J(1))}L${f1(p2[0] + J(1))},${f1(p2[1] + J(1))}Z`, fill: color || C.ink, stroke: color || C.ink, "stroke-width": 3, "stroke-linejoin": "round" }, parent);
}
/* 荧光笔高亮：边缘不齐的一条色带 */
function highlight(parent, x, y, w, h, color, rot) {
  /* 用直线连接（不用平滑曲线，避免长边两端鼓出去），描一圈同色粗边让角变圆 */
  const n = Math.max(2, Math.round(w / 120)), top = [], bot = [];
  for (let i = 0; i <= n; i++) { top.push([x + w * i / n + J(2), y + J(3)]); bot.push([x + w * (n - i) / n + J(2), y + h + J(3)]); }
  const pts = top.concat(bot);
  el("path", { d: "M" + pts.map(q => f1(q[0]) + "," + f1(q[1])).join("L") + "Z", fill: color, stroke: color, "stroke-width": Math.min(10, h * 0.3), "stroke-linejoin": "round", opacity: 0.92, transform: rot ? `rotate(${rot} ${f1(x + w / 2)} ${f1(y + h / 2)})` : null }, parent);
}
function pill(parent, cx, cy, s, o) {
  o = o || {};
  const size = o.size || 22, family = o.font || FONT.hand, weight = o.weight || 400;
  const lh = size * 1.3, n = lines(s).length;
  const w = blockW(s, size, family, weight) + (o.padX || 22) * 2, h = n * lh + (o.padY || 9) * 2;
  const g = el("g", { transform: o.rotate ? `rotate(${o.rotate} ${f1(cx)} ${f1(cy)})` : null }, parent);
  sketchShape(g, "rect", { x: cx - w / 2, y: cy - h / 2, w, h, rad: Math.min(18, h / 2) }, { fill: o.bg || C.blueL, stroke: o.border ? undefined : false, width: 2.5, amp: 1 });
  text(g, cx, cy, s, { size, font: family, weight, anchor: "middle", fill: o.color || C.ink, lh });
  return { w, h };
}

/* ---------- 图标（白色线条，24×24 网格） ---------- */
const ICONS = {
  bulb: "M9 18h6M10 21h4M12 3a6 6 0 0 0-4 10.5c.8.8 1 1.5 1 2.5h6c0-1 .2-1.7 1-2.5A6 6 0 0 0 12 3z",
  doc: "M6 3h9l3 3v15H6zM15 3v3h3M9 10h6M9 14h6M9 18h4",
  target: "M12 3a9 9 0 1 0 .01 0M12 7a5 5 0 1 0 .01 0M12 11a1 1 0 1 0 .01 0M13.5 10.5L20 4M17 4h3v3",
  pen: "M4 20h4l11-11-4-4L4 16zM14 6l4 4M13 20h7",
  image: "M3 5h18v14H3zM3 16l5-5 4 4 3-3 6 6M15.5 8.5a1.2 1.2 0 1 0 .01 0",
  plane: "M3 11l18-8-7 18-3-7zM11 14l10-11",
  chart: "M4 20h16M7 20v-6M12 20V10M17 20V5",
  layers: "M12 3l9 5-9 5-9-5zM3 13l9 5 9-5M3 17.5l9 5 9-5",
  check: "M4 12.5l5 5L20 6",
  checklist: "M10 6h10M10 12h10M10 18h10M3.5 6l1.5 1.5L7.5 5M3.5 12l1.5 1.5 2.5-2.5M3.5 18l1.5 1.5 2.5-2.5",

/* ---------- 页面逻辑 ---------- */

/* 画一张图，返回 { svg, warns }；render.py 读 body 上的 data-done / data-warn / data-error */

/* 检查元素之间有没有重叠、有没有超出画布 */
